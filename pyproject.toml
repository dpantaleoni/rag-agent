[project]
name = "agentic-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "docling>=2.96.0",
    "langchain>=1.3.2",
    "langchain-community>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-ollama>=0.2.0",
    "llama-cpp-python>=0.2.0",
    "matplotlib>=3.10.9",
    "mlx-lm>=0.31.3",
    "numpy>=2.4.6",
    "ollama>=0.6.2",
    "pandas>=3.0.3",
    "piper-tts>=1.4.2",
    "pydub>=0.25.1",
    "pyyaml>=6.0.3",
    "seaborn>=0.13.2",
    "soundfile>=0.13.1",
    "sqlite-vec>=0.1.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-mock>=3.15.1",
]
